name: Continuous Integration

on: [push]

jobs:
  build:
    name: Build and publish package
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    env:
      BUILD_CONFIG: Release
      SOLUTION: NHSUKFrontendRazor.sln
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      AZURE_OWNER: ${{ secrets.TEL_AZURE_DEVOPS_USERNAME }}
      AZURE_PATH: ${{ secrets.AZURE_PACKAGES_PATH }}
      AZURE_KEY: ${{ secrets.AZUREDEVOPSKEY }}
      NUGET_PACKAGE: NHSUKFrontendRazor

    strategy:
      matrix:
        dotnet-version: ['3.1.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ICU library
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.2
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.2

      - name: Display GitVersion outputs
        run: |
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"

      - name: Print environment variable
        run: |
          echo "START:----------------------------"
          echo "GITHUB_TOKEN is: $GITHUB_TOKEN"
          echo "GITHUB_OWNER is: $GITHUB_OWNER"
          echo "AZURE_OWNER is: $AZURE_OWNER"
          echo "AZURE_PATH is: $AZURE_PATH"
          echo "AZURE_KEY is: $AZURE_KEY"
          echo "AZURE_DEVOPS_PAT is: ${{ secrets.AZURE_DEVOPS_PAT }}"
          echo "AZUREDEVOPS is: ${{ AZUREDEVOPS }}"
          echo "END:----------------------------"

      - name: Add Azure artifact
        run: dotnet nuget add source 'https://pkgs.dev.azure.com/e-LfH/_packaging/LearningHubFeed/nuget/v3/index.json' --name 'LearningHubFeed'  --username 'kevin.whittaker' --password ${{ secrets.AZUREDEVOPSKEY }} --store-password-in-clear-text

      - name: Add github registry
        run: dotnet nuget add source --username ${{ github.actor }} --password $GITHUB_TOKEN --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Dotnet build
        run:  dotnet build "$SOLUTION" --configuration release

      - name: Package nuget
        run: dotnet pack "$SOLUTION" --configuration "$BUILD_CONFIG" -o package /p:PackageVersion=${{ steps.gitversion.outputs.majorMinorPatch }}

      - name: Push generated package to GitHub registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./package/*.nupkg --api-key "$GITHUB_TOKEN" --source "github" --skip-duplicate

      - name: Push generated package to Azure Feed
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./package/*.nupkg  --source https://pkgs.dev.azure.com/e-LfH/_packaging/LearningHubFeed/nuget/v3/index.json   --api-key ${{ secrets.AZUREDEVOPSKEY }}  --skip-duplicate
